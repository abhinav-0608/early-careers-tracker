name: CI

# Tests and lint on every push and pull request. The poll's own commits (state and the
# README table) are ignored: they change no code, and pushes made with the workflow's
# token do not start other workflows anyway.
on:
  push:
    paths-ignore: ["state/**", "README.md"]
  pull_request:
    paths-ignore: ["state/**", "README.md"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install --quiet ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q
