name: Keep alive

# GitHub disables a scheduled workflow after 60 days without repository activity. The
# poll commits state at least daily, which should be enough, but if those commits ever
# stop counting the tracker would go quiet without a word. This re-enables the poll
# workflow once a week, which resets the 60-day timer whatever else is happening.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  actions: write # enable the poll workflow; nothing else

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Re-enable the poll workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --method PUT "repos/$REPO/actions/workflows/poll.yml/enable"
