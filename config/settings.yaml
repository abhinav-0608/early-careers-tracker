# Run-level settings. Everything here is a knob; none of it is secret.

# Sent with every request so site owners can see who is calling and why.
user_agent: "job-alert-tracker/1.0 (+https://github.com/abhinav-0608/early-careers-tracker)"

# Where batched summaries link to.
repo_url: "https://github.com/abhinav-0608/early-careers-tracker"

http:
  timeout_seconds: 20
  retries: 2                    # extra attempts on 429 / 5xx / network errors
  per_host_delay_seconds: 1.0   # minimum gap between two requests to the same host
  max_workers: 8                # hosts fetched in parallel (one request per host at a time)
  robots_cache_hours: 24        # a host's robots.txt is re-read this often (kept in
                                # state/hosts.json), or sooner after a failed fetch from it
  # A longer gap for particular hosts. (A host's own Crawl-delay is honoured without
  # being listed here.)
  host_delay_seconds:
    apply.workable.com: 5.0     # rate-limits by IP address: it blocked this tracker's
                                # probing for hours during stage 2
  # Hosts checked by hand that have no robots.txt but answer /robots.txt with a redirect
  # to an ordinary page instead of "not found". The client would otherwise treat their
  # rules as unreadable and fetch nothing. A real robots.txt appearing there is obeyed.
  hosts_without_robots_txt:
    - careers.smartrecruiters.com   # redirects to the job-board home page (2026-11-15)
  # The most posting descriptions read in one run, for the first-year eligibility check
  # (only postings that passed a profile's filters and whose title does not settle it,
  # once each). The rest wait for the next run.
  descriptions_per_run: 60
  # The same, for the one run in which a profile's eligibility rules are new or changed:
  # every open posting is then checked again, and a larger budget lets that finish in
  # one run, so the baseline arrives as a single summary. Per-host spacing still applies.
  descriptions_when_rules_change: 400

polling:
  # Kinds of source that are switched off: not polled at all, and not reported as failing.
  # Same names as under every_minutes.
  # How an adapter that is built but not yet proven ships dark. Nothing is off today.
  disabled: []
  # Minimum minutes between polls of a source. 0 = every run (every 15 minutes).
  # A key is an ATS name, or the module name of a custom adapter. A source that is not
  # due is skipped: that is not a failure, and nothing is closed because of it.
  every_minutes:
    greenhouse: 0
    lever: 0
    ashby: 0
    talnet: 0
    jpmorgan: 0
    workday: 0            # Workday sites small enough to be read in full: must stay 0,
                          # the Workday interval is the next line
    workday_search: 60    # Workday sites too large for that, which are searched instead
                          # (about 15 requests each). Between searches only their first
                          # page, the newest 20 postings, is read
    google: 60            # each request is a 1.3 MB page
    workable: 60          # six boards behind one strict rate limit (see host_delay_seconds)
    smartrecruiters: 60   # the public job board, paged by location: a large board
                          # (ServiceNow) is dozens of requests
    amazon: 60            # about 1 MB per page of 100 roles
    apple: 60             # about 7 pages of 320 KB
    amd: 60               # four requests, five seconds apart (the site's Crawl-delay)
    microsoft: 0          # five small requests (10 roles each); raise it if that grows

# Kinds of source taken off polling because their servers refuse the tracker. Nothing is
# asked of them for probe_after_hours; then one request to probe_company every
# probe_every_hours (using its cached robots.txt). A probe that succeeds resumes polling
# at most every resume_every_minutes, with one page per search. If none has succeeded
# give_up_after_days after `since`, probing stops and a health alert asks for the kind
# to be marked unsupported. Delete an entry to resume normal polling at once.
pauses:
  workday:
    since: "2026-11-16T17:00:00+00:00"
    reason: "Cloudflare challenge (HTTP 429) on every Workday server since 2026-11-16 07:00 UTC"
    probe_company: lloyds-banking-group   # wd3; its robots.txt is cached
    probe_after_hours: 48
    probe_every_hours: 6
    resume_every_minutes: 180
    give_up_after_days: 7

readme:
  profile: abhinav              # whose open roles the README table shows

notify:
  server: "https://ntfy.sh"
  batch_threshold: 5            # more than this many new jobs in one run -> one summary
  priority:
    faang_plus: 5
    normal: 3

state:
  close_after_missing_runs: 2   # successful fetches a job must be absent from before it closes
  repost_window_days: 30        # a closed job reappearing within this window is a repost (no alert)
  prune_closed_after_days: 90   # closed jobs are deleted from state after this long

health:
  fail_after_consecutive: 2     # failed runs in a row before a health alert is sent
  fail_after_rate_limited: 3    # the same, for a source whose host answers 429 (rate
                                # limit): the host is backed off between attempts, so
                                # this is three attempts spread over hours
  reminder_hours: 24            # repeat the alert this often while the source stays broken
  accept_empty_after_runs: 8    # a board that stays empty this many runs is accepted as empty
