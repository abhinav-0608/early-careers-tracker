# ---------------------------------------------------------------------------------------
# 3. Locations
#
# Each location string is assigned to the regions whose keywords it contains, then checked
# against that region's rules:
#   allow                  onsite and/or remote ("hybrid" counts as onsite)
#   require_company_tags   the company must carry at least one of these tags
#   exclude                phrases that cancel a match ("cambridge ma" is not the UK)
#
# A string that matches no region and nothing in other_locations is "unclear" and PASSES,
# labelled as unclear, so an unrecognised town never causes a silent miss. If you get an
# alert for somewhere irrelevant, add the place to other_locations.
# ---------------------------------------------------------------------------------------
regions:
  uk:
    label: United Kingdom
    allow: [onsite, remote]
