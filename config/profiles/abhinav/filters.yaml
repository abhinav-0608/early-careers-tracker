# What counts as a matching job. A job must pass all three checks:
#
#   1. ROLE TYPE  decided from the title only
#   2. FIELD      decided from the title plus department
#   3. LOCATION   decided from the location strings
#
# Keyword syntax
#   - Matching ignores case, accents and punctuation: "first-year" == "First Year".
#   - A keyword matches whole words only: "intern" does not match "internal".
#   - A trailing * on a word matches any ending: "program*" matches program, programme,
#     programmes. It works on any word in a phrase: "insight* day*".
#
# To see why a job did or did not match:  python -m jobtracker explain <company-key>

# ---------------------------------------------------------------------------------------
# 1. Role types
#
# Checked top to bottom; the first one whose keywords match wins, so specific types sit
# above generic ones. A job that lands on a disabled type is dropped; it does not fall
# through to a later type. To start receiving a type, set enabled: true. Existing matches
# are then recorded with one "baseline" summary rather than an alert each.
#
# field_match
#   lenient  passes unless the title names a discipline in field_exclude and none of yours.
#            Used for programmes often titled with no discipline at all.
#   strict   the title or department must name one of your fields.
# ---------------------------------------------------------------------------------------
role_types:
  spring_week:
    label: Spring week
    enabled: true
    field_match: lenient
    ntfy_tags: [cherry_blossom]
    include:
      - spring week*
      - spring insight*
      - spring program*
      - spring intern*        # UK "Spring Internship". "Intern, Spring 2027" does not match.
      - spring into
      - spring experience*
      - spring event*
      - spring scheme*
      - spring academy
    exclude:
      - spring boot
      - spring framework
      - spring cloud

  insight:
    label: Insight programme
    enabled: true
    field_match: lenient
    ntfy_tags: [bulb]
    include:
      - insight* day*
      - insight* week*
      - insight* program*
      - insight* event*
      - insight* evening*
      - insight* session*
      - insight* experience*
      - insight* series
      - insight* scheme*
      - insight* into
      - early insight*
      - tech* insight*
      - engineering insight*
      - trading insight*
      - quant* insight*
      - discovery day*
      - discovery week*
      - discovery evening*
      - discovery event*
      - open day*
      - open evening*
      - taster
      - women in tech*

  first_year:
    label: First-year programme
    enabled: true
    field_match: lenient
    ntfy_tags: [seedling]
    include:
      - first year*
      - 1st year*
      - first and second year*
      - 1st and 2nd year*
      - freshman
      - freshmen
      - sophomore*
      - underclass*
      - year 1
      - year one
      - pre penultimate
      - pre intern*
      - externship*
      - discovery program*
      - discovery intern*
      - discovery fellowship
      - explore program*
      - explore intern*
      # Branded programmes that do not say "first year" in the title.
      - step intern*              # Google STEP
      - student training in engineering
      - explore microsoft         # Microsoft Explore
      - microsoft explore
      - meta university
      - uberstar
      - discover citadel
      - fttp                      # Jane Street First-Year Trading and Technology Programme
      - futurefocus               # Optiver
      - future focus

  placement:
    label: Industrial placement
    enabled: false
    field_match: strict
    ntfy_tags: [calendar]
    include:
      - placement*
      - year in industry
      - 12 month*
      - 13 month*
      - sandwich
      - industrial trainee*

  graduate:
    label: Graduate role
    enabled: false
    field_match: strict
    ntfy_tags: [mortar_board]
    include:
      - graduate*
      - new grad*
      - university grad*
      - recent grad*
      - grad program*
      - grad scheme*
      - early career*
      - campus hire*
      - entry level

  # Enabled, but an internship only alerts when its posting says first years (or
  # students of any year) can apply: see "eligibility" at the end of this file.
  summer_internship:
    label: Internship
    enabled: true
    field_match: strict
    ntfy_tags: [sunny]
    include:
      - summer intern*
      - summer analyst*
      - summer student*
      - summer program*
      - intern
      - interns
      - internship*
      - off cycle
      - co op
      - coop

# Titles containing any of these are dropped whatever the role type.
# "phd" is deliberately absent: titles like "Intern (Bachelor, Master or PhD)" are relevant.
global_exclude:
  - senior
  - sr
  - staff
  - principal
  - director
  - head of
  - vice president
  - vp
  - manager
  - lead
  - recruiter
  - recruiting
  - recruitment
  - postdoc*
  - mba
  - experienced

