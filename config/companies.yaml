# Companies to poll, grouped by industry. Built and verified in stage 2 (2026-11-15).
#
# This is the one list shared by every profile. Each company is fetched once per run;
# a profile (config/profiles/<key>/profile.yaml) then sees only the companies in its own
# scope. Nothing personal lives here: which companies are "FAANG+" is set per profile.
#
#   key          stable id used in state and job keys (never rename once in use)
#   industry     big_tech | ai_lab | quant | finance | fintech | cybersecurity | startup
#                A profile watches whole industries, so a company added to one of these
#                reaches every profile watching that industry, unless it is opt_in.
#   opt_in       true = never included through its industry. Only profiles that name this
#                company under scope.companies watch it. Use it when adding a company for
#                one person, so that nobody else starts getting its alerts.
#   tags         the India location rule only passes companies carrying one of these:
#                  big_tech   large public tech company (or a subsidiary of one)
#                  vc_backed  venture-funded and still private, or listed within about two years
#                  yc         went through Y Combinator (kept after an IPO)
#   regions      where the company hires, of uk / us / india (informational)
#   ats          greenhouse | lever | ashby | smartrecruiters | workable | workday | talnet
#                                                      polled through the adapter of that name
#                custom                                own careers site, one module each under
#                                                      sources/custom/ (amazon, amd, apple,
#                                                      google, jpmorgan, microsoft)
#                unsupported                           cannot be polled; the note says why
#   board        the board identifier in the ATS's public API (module name for custom)
#   tenant, host, sites
#                Workday: https://{tenant}.{host}.myworkdayjobs.com/{site}. A company
#                lists every site worth polling (experienced, campus, graduate ...).
#   tenant, board, sites
#                tal.net: https://{tenant}.tal.net/vx/{board}/candidate/jobboard/vacancy/{site}/adv/
#                board is the tenant's path prefix; sites are job-board numbers, quoted.
#   verified     date the identifier last returned live postings. Absent means not yet
#                verified; the note says why.
#
# Excluded on purpose: consulting and Big 4 firms, and SpaceX.


