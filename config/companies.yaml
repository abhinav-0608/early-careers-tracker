#   key          stable id used in state and job keys (never rename once in use)
#   industry     big_tech | ai_lab | quant | finance | fintech | cybersecurity | startup
#   tags         big_tech / vc_backed / yc (the India location rule depends on these)
#   regions      where the company hires (informational)
#   tier         dream (priority 5 alerts, never batched) | normal
